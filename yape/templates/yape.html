<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Pago con Yape</title>
  {% load static %}
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>💳</text></svg>">
</head>
<body>
  <h1>Generar Token de Pago con Yape</h1>

  <!-- SDK de Mercado Pago -->
  <script src="https://sdk.mercadopago.com/js/v2"></script>

<h2>Pagar con Yape</h2>
<form id="yape-form">
  <label for="phone">Número de celular (Yape):</label>
  <input type="text" id="phone" name="phone" placeholder="9XXXXXXXX" required>

  <label for="otp">Código OTP:</label>
  <input type="text" id="otp" name="otp" placeholder="123456" required>

  <label for="amount">Monto (S/):</label>
  <input type="number" id="amount" name="amount" placeholder="1.00" step="0.01" min="0.10" required>

  {% csrf_token %}

  <button type="submit">Generar token y pagar</button>
</form>

<p id="resultado"></p>

<script>
  // Inicializa Mercado Pago con tu clave pública (opcional en simulación)
  let mp = null;
  try {
    if ("{{ public_key }}" && "{{ public_key }}".trim().length > 0) {
      mp = new MercadoPago("{{ public_key }}");
    } else {
      console.warn("MP_PUBLIC_KEY no configurado; flujo en modo simulación");
    }
  } catch (e) {
    console.warn("No se pudo inicializar Mercado Pago SDK:", e);
  }

  // Captura el formulario
  const form = document.getElementById("yape-form");
  const resultado = document.getElementById("resultado");

  async function getYapeToken(mpInstance, phone, otp) {
    if (!mpInstance || typeof mpInstance.yape !== 'function') {
      throw new Error('SDK de Mercado Pago no disponible para Yape');
    }
    const yape = mpInstance.yape({ otp, phoneNumber: phone });
    const res = await yape.create();
    // Algunos SDKs devuelven objeto; necesitamos el ID (string) del token
    const tokenId = (res && (res.id || res.token || res.value)) ? (res.id || res.token || res.value) : null;
    if (!tokenId || typeof tokenId !== 'string') {
      console.error('Token Yape inválido. Resultado:', res);
      throw new Error('Token Yape inválido: ' + JSON.stringify(res));
    }
    return tokenId;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const phone = document.getElementById("phone").value;
    const otp = document.getElementById("otp").value;
    const amount = document.getElementById("amount").value;

    try {
      const token = await getYapeToken(mp, phone, otp);
      console.log("✅ Token generado (id):", token);
      resultado.innerText = "Token generado (id): " + token;

      // Enviar el token y datos al backend (Django)
      const response = await fetch("/procesar_pago/", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-CSRFToken": getCookie('csrftoken')  // Protección CSRF
        },
        body: JSON.stringify({ token, phone, otp, amount })
      });

      const data = await response.json();
      let detalle = "";
      if (data.mp_payment_id) {
        detalle = `\nID MP: ${data.mp_payment_id} | Estado MP: ${data.mp_status} | Estado local: ${data.local_status}`;
      }
      if (!response.ok) {
        const err = data?.data || data;
        resultado.innerText = `${data.message || 'Error en pago'}\n${detalle}\n${JSON.stringify(err)}`;
      } else {
        resultado.innerText = `${data.message}${detalle}`;
      }

    } catch (error) {
      console.error(error);
      resultado.innerText = "❌ Error al generar token o procesar pago.";
    }
  });

  // Obtener CSRF token (Django)
  function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== "") {
      const cookies = document.cookie.split(";");
      for (let i = 0; i < cookies.length; i++) {
        const cookie = cookies[i].trim();
        if (cookie.substring(0, name.length + 1) === (name + "=")) {
          cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
          break;
        }
      }
    }
    return cookieValue;
  }
</script>


</body>
</html>
